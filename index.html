 <!DOCTYPE html>
<html>
<head>
<title>Aditi Ultra Premium</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#db2777);
color:white;
font-family:Arial;
text-align:center;
}

img{
width:320px;
height:420px;
object-fit:cover;
border-radius:25px;
margin:20px;
box-shadow:0 0 25px rgba(255,255,255,.4);
}

h1{
font-size:50px;
}.star{
position:fixed;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite;
}

@keyframes twinkle{
50%{
opacity:.2;
}
}.heart{
position:fixed;
font-size:18px;
animation:float 8s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
}
100%{
transform:translateY(-120px);
}
}
</style>

</head>

<body>

<h1>✨ Welcome To Aditi's Universe ✨</h1>

<img id="slide" src="photo1.png">

<p>Ultra Premium Version Loading ❤️</p>

<script>

const photos=[
"photo1.png",
"photo2.png",
"photo3.png",
"photo4.png"
];

let current=0;

setInterval(()=>{

current=(current+1)%photos.length;

document.getElementById("slide").src=
photos[current];

},2000);
for(let i=0;i<100;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}for(let h=0;h<25;h++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=
(4+Math.random()*5)+"s";

document.body.appendChild(heart);

}
</script>

</body>
</html>
